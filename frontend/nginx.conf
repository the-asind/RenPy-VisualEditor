server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /docs {
        try_files /docs.html =404;
    }

    location = /ru {
        return 301 /ru/;
    }

    location = /ru/ {
        try_files /ru/index.html =404;
    }
    location = /de { return 301 /de/; }
    location = /de/ { try_files /de/index.html =404; }
    location = /ja { return 301 /ja/; }
    location = /ja/ { try_files /ja/index.html =404; }
    location = /zh { return 301 /zh/; }
    location = /zh/ { try_files /zh/index.html =404; }

    location = /app-shell.html {
        try_files /app-shell.html =404;
    }

    location = /login {
        try_files /app-shell.html =404;
    }
    location = /register {
        try_files /app-shell.html =404;
    }
    location = /projects {
        try_files /app-shell.html =404;
    }
    location = /editor {
        try_files /app-shell.html =404;
    }
    location = /profile {
        try_files /app-shell.html =404;
    }
    location = /users {
        try_files /app-shell.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /env.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri =404;
    }
}
