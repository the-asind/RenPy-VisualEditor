global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: plotmio-backend
    scheme: https
    metrics_path: /internal/metrics
    static_configs:
      - targets:
          - plotmio.com:443
  - job_name: plotmio-application-host
    scheme: https
    metrics_path: /internal/host-metrics
    static_configs:
      - targets:
          - plotmio.com:443
  - job_name: plotmio-offhost-backup
    metrics_path: /health.prom
    static_configs:
      - targets:
          - 127.0.0.1:19092
