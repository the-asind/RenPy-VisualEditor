# Install this file inside nginx's http context (for Debian/Ubuntu:
# /etc/nginx/sites-available/renpy, symlinked from sites-enabled).
map $http_upgrade $renpy_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=renpy_register:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=renpy_login:10m rate=10r/m;
map $request_method $renpy_create_key {
    default '';
    POST $binary_remote_addr;
}
limit_req_zone $renpy_create_key zone=renpy_project_create:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=renpy_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=renpy_connections:10m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name renpy.online www.renpy.online;

    ssl_certificate /etc/letsencrypt/live/renpy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/renpy.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;
    client_body_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn renpy_connections 20;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/auth/register {
        limit_req zone=renpy_register burst=3 nodelay;
        proxy_pass http://127.0.0.1:9000;
    }

    location = /api/auth/token {
        limit_req zone=renpy_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:9000;
    }

    location = /api/projects/ {
        limit_req zone=renpy_project_create burst=5 nodelay;
        proxy_pass http://127.0.0.1:9000;
    }

    location = /api/projects/demo/clockwork-library {
        limit_req zone=renpy_project_create burst=3 nodelay;
        proxy_pass http://127.0.0.1:9000;
    }

    location ^~ /api/ws/ {
        limit_conn renpy_connections 10;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $renpy_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=renpy_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:9000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:9000/health;
    }

    location ^~ /demo-assets/ {
        limit_req zone=renpy_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:9000;
    }

    # Prometheus runs on the FIN VPS. No other public client may read metrics.
    location = /internal/metrics {
        allow 144.31.82.129;
        allow 10.20.30.1;
        deny all;
        proxy_pass http://127.0.0.1:9000/metrics;
    }

    location / {
        proxy_pass http://127.0.0.1:5137;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name renpy.online www.renpy.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://renpy.online$request_uri;
    }
}
