services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    restart: unless-stopped
    ports:
      - "5137:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_WS_URL}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - db-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/renpy_editor.db
      - LOG_LEVEL=info

volumes:
  db-data:
    name: renpy_editor_db
